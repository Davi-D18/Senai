<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form>
    <h1>Cadastro</h1>

    <div class="nome">
      <label for="nome-completo">Nome Completo</label>
      <input type="text" id="nome-completo" name="nome-usuario" required placeholder="Ex: João">
    </div>

    <div class="email">
      <label for="email">Email</label>
      <input type="email" id="email" name="email-usuario" required placeholder="Ex: joao1234@gmail.com">
    </div>

    <div class="senha">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>
      <p>Senha deve conter 8 caracteres no mínimo</p>
      <div id="forca-senha"></div>
    </div>

    <div class="confirm-senha">
      <label for="confirma-senha">Confirme a senha</label>
      <input type="password" id="confirma-senha" required>
    </div>
  
    <button>Enviar</button>
  </form>

  <div class="resposta">
    <p class="info"></p>
  </div>
  <script src="index.js"></script>
</body>
</html>
