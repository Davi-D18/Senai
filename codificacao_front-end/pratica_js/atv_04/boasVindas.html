<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boas Vindas</title>
  </head>
  <style>
    .active {
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-top: 35vh;
      margin-left: 45vw;
      background: linear-gradient(
        to right,
        rgb(128, 57, 243),
        rgba(174, 56, 228, 0.747)
      );
      color: white;
      cursor: pointer;
    }

    .active:hover {
      box-shadow: 0px 0px 7px black;
      transition: all 0.3s;
    }
  </style>
  <body>
    <button class="active">Saudação</button>

    <script>
      const buttonActive = document.querySelector(".active");

      buttonActive.addEventListener("click", (event) => {
        let nomeUsuario = prompt("Qual seu nome? ");
        alert(`Olá ${nomeUsuario}, Seja muito Bem vindo :)`);
      });
    </script>
  </body>
</html>
