<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Formulário Para pegar os nomes que o suário digitar e exibir em um input
    </title>
    <style>
      .saida {
        text-transform: capitalize;
        font-size: 20px;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
        margin-top: 2rem;
      }

      button {
        background: linear-gradient(140deg, rgb(76, 15, 229), rgb(207, 5, 193));
        color: white;
        padding: 9px;
        margin-left: 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }

      button:hover {
        background: linear-gradient(140deg, rgb(55, 13, 161), rgb(137, 4, 128));;
        transform: scale(0.96);
        transition: all 0.5s;
      }

      input {
        border-radius: 5px;
        border: none;
        padding: 5px 8px;
      }

      main {
        max-width: 400px;
        margin: auto;

        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      
      .button {
        display: flex;
        justify-content: center;
        margin-top: 3rem;
      }
    </style>
  </head>
  <body>
    <main>
      <form>
        <input type="text" class="valorUsuario" placeholder="Insira um nome" />
        <input
          type="text"
          class="valorUsuario2"
          placeholder="Insira outro nome"
        />
        <p class="saida"></p>
        <div class="button">
          <button>Exibir Nomes</button>
        </div>
      </form>
    </main>

    <script>
      const formulario = document.querySelector("form");
      const resultadoDaSaida = document.querySelector(".saida");

      formulario.addEventListener("submit", (event) => {
        event.preventDefault();
        const input1 = document.querySelector(".valorUsuario").value;
        const input2 = document.querySelector(".valorUsuario2").value;

        let nomeConcatenado = `${input1}  ${input2}`;
        resultadoDaSaida.textContent = nomeConcatenado
      });
    </script>
  </body>
</html>
