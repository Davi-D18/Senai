<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Calculadora</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Mini Calculadora</h1>
      <section class="resultado">
        <p><span id="resultado">0</span></p>
      </section>
      <form>
        <input type="text" placeholder="Digite o 1º número" id="numero1" required />
        <input type="text" placeholder="Digite o 2º número" id="numero2" required />
        <select required>
          <option value="" disabled selected>Escolha a operação</option>
          <option value="add">+</option>
          <option value="subtract">-</option>
          <option value="multiply">*</option>
          <option value="divide">/</option>
        </select>
        <button type="submit">Calcular</button>
      </form>

      
    </main>

    <script src="./index.js"></script>
  </body>
</html>
