<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcular Multiplicação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        ---cinza-claro: #f3f4f6;
        ---secundaria: #3b82f6;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Red Hat Display", sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      main {
        max-width: 400px;
        margin: auto;
        text-align: center;
        background-color: var(---cinza-claro);
        border-radius: 10px;
        padding: 8px;
      }

      .instrucoes:after {
        content: "⏬";
      }

      .multi {
        background: linear-gradient(140deg, rgb(76, 15, 229), rgb(207, 5, 193));
        color: white;
        padding: 6px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 1.5rem;
      }

      .multi:hover {
        transition: all 0.3s;
        transform: scale(0.97);
        box-shadow: 0px 0px 2px black;
      }

      .resultado {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Multiplicação</h1>
        <p class="instrucoes">
          Para realizar a multiplicação, clique no botão abaixo
        </p>
  
        <button class="multi">Realizar Multiplicação</button>
      </section>

      <section class="resultado-section">
        <div class="resultado">
          <span></span>
        </div>
      </section>
    </main>

    <script>
      const button = document.querySelector("button");
      const spanResult = document.querySelector("span") 

      button.addEventListener("click", () => { // Arrow Function (Função de Seta)
        spanResult.textContent = ""
        const num1 = prompt("Digite um número")
        const num2 = prompt("Digite um 2° número")

        function calcular() {return num1 * num2}

        spanResult.textContent = calcular()

      })
    </script>
  </body>
</html>
